<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 33.7448 33.7448" fill="none">
  <title>DOMTRIK</title>
  <!-- знак из логотипа: оранжевый круг с белой «D».
       В самом логотипе у этого круга срезан правый бок — там его перекрывает
       тёмный круг с «T». Отдельно срез читается как брак отрисовки, поэтому
       здесь круг целый, а буква собрана из тех же контуров, что в логотипе. -->
